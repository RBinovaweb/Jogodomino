<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dominó Online</title>

<style>
body{
margin:0;
font-family:Arial;
background:#1e2a38;
color:#fff;
text-align:center;
}

input,button{
padding:10px;
margin:5px;
border-radius:8px;
border:none;
}

button{
background:#00c6ff;
font-weight:bold;
cursor:pointer;
}

#mesa,#mao{
display:flex;
justify-content:center;
flex-wrap:wrap;
margin-top:20px;
min-height:60px;
}

.peca{
background:#fff;
color:#000;
padding:10px;
margin:5px;
border-radius:6px;
cursor:pointer;
font-weight:bold;
}
</style>
</head>
<body>

<h2>🎲 Dominó Online</h2>

<input id="nome" placeholder="Seu nome">
<br>
<input id="sala" placeholder="Código da sala">
<br>
<button onclick="criar()">Criar Sala</button>
<button onclick="entrar()">Entrar</button>

<h3 id="status"></h3>
<h3 id="nomes"></h3>

<h3>Mesa</h3>
<div id="mesa"></div>

<h3>Sua Mão</h3>
<div id="mao"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getDatabase, ref, set, get, onValue, update } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBQqW2RRzy44R-CzgsdGHWBv0rr3ZVL-Ls",
  authDomain: "online-f415d.firebaseapp.com",
  databaseURL: "https://online-f415d-default-rtdb.firebaseio.com",
  projectId: "online-f415d",
  storageBucket: "online-f415d.firebasestorage.app",
  messagingSenderId: "303566606960",
  appId: "1:303566606960:web:1006d0865cacbe6b1e9ab5"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let salaAtual = "";
let lado = "";
let mao = [];

function gerar(){
let p=[];
for(let i=0;i<=6;i++){
for(let j=i;j<=6;j++){
p.push([i,j]);
}
}
return p.sort(()=>Math.random()-0.5);
}

window.criar = async function(){

const nome=document.getElementById("nome").value.trim();
if(!nome) return alert("Digite seu nome");

lado="j1";
salaAtual=Math.random().toString(36).substring(2,6).toUpperCase();
document.getElementById("sala").value=salaAtual;

let pecas=gerar();
let mao1=pecas.splice(0,7);
let mao2=pecas.splice(0,7);

await set(ref(db,"salas/"+salaAtual),{
nome1:nome,
nome2:null,
j1:mao1,
j2:mao2,
mesa:[],
vez:"j1"
});

escutar();
}

window.entrar = async function(){

const nome=document.getElementById("nome").value.trim();
if(!nome) return alert("Digite seu nome");

salaAtual=document.getElementById("sala").value.trim();
if(!salaAtual) return alert("Digite a sala");

const snap=await get(ref(db,"salas/"+salaAtual));
if(!snap.exists()) return alert("Sala não encontrada");

lado="j2";

await update(ref(db,"salas/"+salaAtual),{
nome2:nome
});

escutar();
}

function escutar(){

onValue(ref(db,"salas/"+salaAtual),(snap)=>{
let d=snap.val();
if(!d) return;

document.getElementById("nomes").innerText =
d.nome1+" vs "+(d.nome2?d.nome2:"Aguardando");

if(!d.nome2){
document.getElementById("status").innerText="Esperando jogador 2...";
return;
}

mao=d[lado];

if(!mao){
document.getElementById("status").innerText="Erro ao carregar mão";
return;
}

renderMesa(d.mesa);
renderMao();

if(d.vez===lado){
document.getElementById("status").innerText="Sua vez";
}else{
document.getElementById("status").innerText="Vez do adversário";
}
});
}

function renderMesa(m){
const div=document.getElementById("mesa");
div.innerHTML="";
m.forEach(p=>{
let el=document.createElement("div");
el.className="peca";
el.innerText=p[0]+"|"+p[1];
div.appendChild(el);
});
}

function renderMao(){
const div=document.getElementById("mao");
div.innerHTML="";
mao.forEach((p,i)=>{
let el=document.createElement("div");
el.className="peca";
el.innerText=p[0]+"|"+p[1];
el.onclick=()=>jogar(i);
div.appendChild(el);
});
}

function jogar(i){

onValue(ref(db,"salas/"+salaAtual),(snap)=>{
let d=snap.val();
if(d.vez!==lado) return;

let mesa=d.mesa;
let peca=mao[i];

if(mesa.length===0 || mesa[mesa.length-1][1]===peca[0]){
mesa.push(peca);
mao.splice(i,1);

update(ref(db,"salas/"+salaAtual),{
[lado]:mao,
mesa:mesa,
vez: lado==="j1"?"j2":"j1"
});
}
},{onlyOnce:true});
}

</script>

</body>
</html>
